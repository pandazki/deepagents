# EvoAgent Docker Compose - deepagents as genome
# The genome (libs/deepagents/) evolves, bootstrap is fixed

version: '3.8'

services:
  evo-agent:
    build:
      context: ./evo_bootstrap
      dockerfile: Dockerfile
    ports:
      - "8080:8080"
    environment:
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY}
      - GITHUB_TOKEN=${GITHUB_TOKEN}
      - GITHUB_REPO=${GITHUB_REPO:-pandazki/deepagents}
      - GENOME_BRANCH=${GENOME_BRANCH:-evo-seed}
      - ORGANISM_ID=${ORGANISM_ID:-org_seed}
    volumes:
      - agent_workspace:/workspace
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 3

volumes:
  agent_workspace:
