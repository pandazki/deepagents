# EvoAgent Docker Compose
# 用于本地测试种子 Agent

version: '3.8'

services:
  # 种子 Agent 沙盒
  evo-agent:
    build:
      context: ./evo_agent
      dockerfile: Dockerfile
    ports:
      - "8080:8080"
    environment:
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY}
      - GITHUB_TOKEN=${GITHUB_TOKEN}
      - GITHUB_REPO=${GITHUB_REPO:-pandazki/deepagents}
      - ORGANISM_ID=${ORGANISM_ID:-org_seed}
      - GENOME_BRANCH=${GENOME_BRANCH:-evo-seed}
    volumes:
      # 可选：挂载本地代码用于开发
      # - ./evo_agent:/workspace/evo_agent:ro
      - agent_workspace:/workspace
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 3

volumes:
  agent_workspace:
